<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Murline</title>
    <style>
      /* The paper of the app, before its stylesheet loads: the window opens on grey, not on white.
         `color-scheme` picks the same grey src/index.css names, until the theme setting pins one. */
      html {
        color-scheme: light dark;
        background: light-dark(#f4f4f4, #202020);
      }
      /* The body holds no default margin, so the static log sits where React's copy lands. */
      body {
        margin: 0;
      }
      /* The muted ink the boot log writes with, the same pair src/index.css names. */
      :root {
        --muted: light-dark(#6e6e6e, #8f8f8f);
      }
      /* The boot screen paints before the stylesheet loads, so its whole look lives here. The log
         hangs from an anchor above the middle and grows downward, so no line moves when one lands. */
      .boot {
        margin: 0;
        padding: 42vh 24px 24px;
        font: 12px/20px ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--muted);
      }
      @keyframes boot-blink {
        50% {
          opacity: 0;
        }
      }
      .boot-cursor {
        animation: boot-blink 1s step-end infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-cursor {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"><pre class="boot">&gt; starting …
<span class="boot-cursor">█</span></pre></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
