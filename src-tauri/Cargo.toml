[package]
name = "murline"
version = "0.1.2"
description = "Practise piano from sheet music with a MIDI keyboard"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.96"

[lib]
name = "murline_lib"
crate-type = ["rlib"]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# The voice engine casts between sample counts, frames and floats on purpose, hundreds of times.
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
# The docs are prose, not identifier lists.
doc_markdown = "allow"
# The tests compare exact floats they set themselves.
float_cmp = "allow"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
flate2 = "1"
midir = "0.10"
quick-xml = "0.42"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8.6", default-features = false, features = ["derive", "macros", "migrate", "runtime-tokio", "sqlite"] }
tar = "0.4"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.0"
# The macOS update arrives as a .app.tar.gz, which the zip feature unpacks; native-tls keeps one
# TLS stack in the build, the same one reqwest uses.
tauri-plugin-updater = { version = "2.10.1", default-features = false, features = [
    "native-tls",
    "zip",
] }
trash = { version = "5", default-features = false, features = ["coinit_apartmentthreaded"] }
unicode-normalization = "0.1"
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
tempfile = "3"
# The async tests need a runtime of their own; the app runs on Tauri's.
tokio = { version = "1", features = ["rt", "macros"] }

# The voice engine renders on the audio thread; unoptimized it costs about fourteen times the
# release build and drops out past a hundred voices, so a dev build is optimized too.
[profile.dev]
opt-level = 1

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-audio-toolbox = "0.3"
objc2-avf-audio = { version = "0.3", features = ["objc2-audio-toolbox"] }
objc2-core-audio = { version = "0.3", features = ["AudioHardware"] }
objc2-core-audio-types = "0.3"
objc2-core-foundation = "0.3"
objc2-foundation = { version = "0.3", features = ["block2"] }
