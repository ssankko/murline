[package]
name = "piano"
version = "0.1.0"
description = "Practise piano from sheet music with a MIDI keyboard"
edition = "2024"
rust-version = "1.96"

[lib]
name = "piano_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
flate2 = "1"
quick-xml = "0.42"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tar = "0.4"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.0"
tauri-plugin-midi = "0.2.0"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
trash = { version = "5", default-features = false }
unicode-normalization = "0.1"
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSGraphics", "NSResponder", "NSView", "NSViewController", "NSWindow"] }
objc2-audio-toolbox = "0.3"
objc2-avf-audio = { version = "0.3", features = ["objc2-audio-toolbox"] }
objc2-core-audio = { version = "0.3", features = ["AudioHardware"] }
objc2-foundation = "0.3"
